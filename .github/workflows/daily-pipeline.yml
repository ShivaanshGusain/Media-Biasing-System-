name: Weekly BiasLens Pipeline
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest Kaggle API
        run: pip install --upgrade kaggle

      - name: Authenticate with Kaggle
        run: |
          mkdir -p ~/.config/kaggle
          echo "${{ secrets.KAGGLE_KEY }}" > ~/.config/kaggle/access_token
          chmod 600 ~/.config/kaggle/access_token

      - name: Inject GitHub Token into Notebook
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          # Finds the placeholder and injects the live secret on the fly
          sed -i "s|GITHUB_TOKEN_PLACEHOLDER|${MY_GITHUB_TOKEN}|g" media-biaser.ipynb

      - name: Trigger Kaggle Run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push -p .
