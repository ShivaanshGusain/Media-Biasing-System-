name: Weekly BiasLens Pipeline
on:
  schedule:
    - cron: '0 0 * * 0' 
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest Kaggle API
        run: pip install --upgrade kaggle

      - name: Authenticate with Kaggle
        # Grabbing YOUR specific secret name: KAGGLE_KEY
        run: |
          mkdir -p ~/.config/kaggle
          echo "${{ secrets.KAGGLE_KEY }}" > ~/.config/kaggle/access_token
          chmod 600 ~/.config/kaggle/access_token

      - name: Trigger Kaggle Run
        env:
          # The Kaggle CLI expects the environment variable to be named KAGGLE_API_TOKEN,
          # so we map it directly to your KAGGLE_KEY secret here.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push -p .
