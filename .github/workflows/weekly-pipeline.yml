name: Weekly BiasLens Pipeline
on:
  schedule:
    - cron: '0 0 * * 0' 
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest Kaggle API
        run: pip install --upgrade kaggle

      - name: Authenticate with Kaggle
        run: |
          mkdir -p ~/.config/kaggle
          echo "${{ secrets.KAGGLE_KEY }}" > ~/.config/kaggle/access_token
          chmod 600 ~/.config/kaggle/access_token

      - name: Inject GitHub Token into Notebook
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          python -c '
          import json, os
          token = os.environ.get("MY_GITHUB_TOKEN", "")
          with open("media-biaser.ipynb", "r", encoding="utf-8") as f:
              nb = json.load(f)
          for cell in nb.get("cells", []):
              if cell.get("cell_type") == "code":
                  new_source = []
                  for line in cell.get("source", []):
                      search_str = "user_secrets.get_secret(" + chr(34) + "GITHUB_TOKEN" + chr(34) + ")"
                      replace_str = chr(34) + token + chr(34)
                      if search_str in line:
                          line = line.replace(search_str, replace_str)
                      new_source.append(line)
                  cell["source"] = new_source
          with open("media-biaser.ipynb", "w", encoding="utf-8") as f:
              json.dump(nb, f, indent=1)
          '

      - name: Trigger Kaggle Run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle kernels push -p .
